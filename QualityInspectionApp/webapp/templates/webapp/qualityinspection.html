<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Inspection Selection</title>
<style>
:root {
    --bg: #081321;
    --panel: #111f32;
    --panel-light: #16263c;
    --border: #293d57;
    --text: #f4f7fc;
    --muted: #a9bbd3;
    --blue: #168cff;
    --blue-dark: #0877e9;
    --green: #20cf82;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
}

.header {
    padding: 30px 40px;
    border-bottom: 1px solid var(--border);
    background:
        linear-gradient(90deg, rgba(8,19,33,.98), rgba(8,19,33,.78)),
        url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1800&q=85')
        center 55% / cover;
}

.header h1 {
    font-size: clamp(26px, 3vw, 36px);
    margin-bottom: 9px;
}

.header p {
    color: #c4d7f0;
    line-height: 1.6;
}

.container {
    max-width: 1200px;
    margin: 45px auto;
    padding: 20px 30px;
}

.back-btn {
    display: inline-block;
    margin-bottom: 30px;
    padding: 11px 19px;
    color: white;
    background: #263b55;
    border: 1px solid #3a506d;
    border-radius: 8px;
    text-decoration: none;
    transition: background .2s ease, transform .2s ease;
}

.back-btn:hover {
    background: #344d6b;
    transform: translateY(-1px);
}

.selection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
}

.inspection-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    min-height: 190px;
    padding: 30px;
    color: var(--text);
    background: linear-gradient(145deg, var(--panel-light), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(0,0,0,.16);
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.inspection-btn:hover {
    transform: translateY(-5px);
    border-color: var(--blue);
    background: linear-gradient(145deg, #18395b, #10243b);
    box-shadow: 0 12px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(22,140,255,.12);
}

.inspection-icon {
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    color: white;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    border-radius: 16px;
    font-size: 29px;
}

.inspection-description {
    max-width: 300px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.6;
}

@media (max-width: 650px) {
    .header {
        padding: 25px 22px;
    }

    .container {
        margin: 25px auto;
        padding: 15px;
    }

    .selection-grid {
        grid-template-columns: 1fr;
    }

    .inspection-btn {
        min-height: 165px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Quality Inspection</h1>
    <p>Select the type of inspection you would like to perform</p>
</header>

<main class="container">

    <a href="{% url 'welcome' %}" class="back-btn">
        ← Back to Dashboard
    </a>

    <section class="selection-grid" aria-label="Inspection types">

        <a href="{% url 'F2' %}" class="inspection-btn">
            <span class="inspection-icon" aria-hidden="true">⚠</span>
            <span>F2 Damage Inspection List</span>
            <span class="inspection-description">
                Open the F2 inspection list to record and review vehicle damage.
            </span>
        </a>

    </section>

</main>

</body>
</html>
