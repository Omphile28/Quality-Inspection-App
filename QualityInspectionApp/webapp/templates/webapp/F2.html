<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F2 Damage Inspection List</title>

<style>

body{
    font-family:Baskerville Old Face,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
}

h1{
    color:#003B71;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.checklist{
    margin-top:20px;
}

.checklist label{
    display:block;
    font-weight:normal;
    margin-bottom:10px;
}

#damageSection,
#leaderSection{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#FFF8E1;
    border-radius:8px;
}

.button-bar{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.btn{
    border:none;
    padding:12px 25px;
    color:white;
    cursor:pointer;
    border-radius:6px;
}

.end-btn{
    background:#C62828;
}

.next-btn{
    background:#2E7D32;
}
.back-btn{

    display:inline-block;

    margin-bottom:30px;

    background:#6c757d;

    color:white;

    text-decoration:none;

    padding:12px 25px;

    border-radius:8px;
}

.back-btn:hover{
    background:#555;
}

#inspectionTable{
    display:none;
    margin-top:40px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003B71;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.damage-row{
    background:yellow;
}

.reject-row{
    background:red;
    color:white;
}

.employee-info{
    text-align:right;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="employee-info">

<b>Name:</b> John Smith<br>
<b>Employee Card Nr:</b> EMP10001<br>
<b>Date:</b> <span id="today"></span>

</div>

<h1>F2 Damage Inspection List</h1>

<form id="inspectionForm">

<div class="form-group">
<label>Vehicle VIN Number</label>
<input type="text" id="vin" required>
</div>

<div class="form-group">
<label>Battery %</label>
<input type="number" id="battery">
</div>

<div class="form-group">
<label>Number of Keys</label>
<input type="number" id="keys">
</div>

<div class="form-group">
<label>Number of Key Cards</label>
<input type="number" id="cards">
</div>

<div class="form-group">
<label>Destination</label>
<input type="text" id="destination">
</div>

<h3>Inspection Checklist</h3>

<div class="checklist">

<label><input type="checkbox"> Door Protection Strip</label>
<label><input type="checkbox"> Tow Hook & Covers</label>
<label><input type="checkbox"> Interior Carpet Footprint</label>
<label><input type="checkbox"> Front Passenger Seat Covers</label>
<label><input type="checkbox"> Weekly Battery Identifier</label>
<label><input type="checkbox"> BI Pack</label>
<label><input type="checkbox"> Floor Carpets</label>
<label><input type="checkbox"> Tyre Repair Kit</label>
<label><input type="checkbox"> Lock Nut</label>
<label><input type="checkbox"> Charging Cable G45</label>
<label><input type="checkbox"> Number Plate Carrier</label>

</div>

<div class="form-group">

<label>Damage?</label>

<select id="damage">

<option>No</option>
<option>Yes</option>

</select>

</div>

<div id="damageSection">

<h3>Damage Details</h3>

<textarea id="comments"
placeholder="Describe the damage..."></textarea>

<br><br>

<input type="file" accept="image/*">

<br><br>

<label>Reject Vehicle?</label>

<select id="reject">

<option>No</option>
<option>Yes</option>

</select>

</div>

<div id="leaderSection">

<h3>Production Team Leader Approval</h3>

<label>Company ID Number</label>

<input type="text">

<label>Signature</label>

<input type="text">

</div>

<div class="button-bar">

<button
type="button"
class="btn end-btn"
onclick="endInspection()">

End Inspection

</button>

<button
type="button"
class="btn next-btn"
onclick="saveVehicle()">

Next

</button>

</div>

</form>

<div id="inspectionTable">

<h2>Inspection Records</h2>

<table>

<thead>

<tr>

<th>VIN</th>
<th>Battery %</th>
<th>Keys</th>
<th>Key Cards</th>
<th>Destination</th>
<th>Damage</th>
<th>Rejected</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script>

const records=[];

const today=new Date();

document.getElementById("today").innerHTML=
String(today.getDate()).padStart(2,'0')
+"/"+
String(today.getMonth()+1).padStart(2,'0')
+"/"+
String(today.getFullYear()).slice(-2);

document
.getElementById("damage")
.addEventListener("change",function(){

document.getElementById("damageSection")
.style.display=
this.value==="Yes"
? "block"
: "none";

});

document
.getElementById("reject")
.addEventListener("change",function(){

document.getElementById("leaderSection")
.style.display=
this.value==="No"
? "block"
: "none";

});

function saveVehicle(){

let vin=document.getElementById("vin").value;
let battery=document.getElementById("battery").value;
let keys=document.getElementById("keys").value;
let cards=document.getElementById("cards").value;
let destination=document.getElementById("destination").value;

let damage=document.getElementById("damage").value;

let reject=
document.getElementById("reject")
? document.getElementById("reject").value
: "No";

records.push({
vin,
battery,
keys,
cards,
destination,
damage,
reject
});

document.getElementById("inspectionForm").reset();

document.getElementById("damageSection").style.display="none";
document.getElementById("leaderSection").style.display="none";

alert("Vehicle saved. Start next inspection.");

}

function endInspection(){

let tbody=document.getElementById("tableBody");

tbody.innerHTML="";

records.forEach(r=>{

let row=document.createElement("tr");

if(r.reject==="Yes"){
row.classList.add("reject-row");
}
else if(r.damage==="Yes"){
row.classList.add("damage-row");
}

row.innerHTML=`

<td>${r.vin}</td>
<td>${r.battery}</td>
<td>${r.keys}</td>
<td>${r.cards}</td>
<td>${r.destination}</td>
<td>${r.damage}</td>
<td>${r.reject}</td>

`;

tbody.appendChild(row);

});

document
.getElementById("inspectionTable")
.style.display="block";

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>
</html>
